name: Collect

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: npm resolves a bare `npx -y <pkg>` to the newest
      # version whose engines.node accepts the running Node, not to the
      # `latest` tag. On Node 20 that silently pinned @sentry/mcp-server at
      # 0.36.0 for a month (DECISIONS.md #21).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - id: collect
        run: npm run collect

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: snapshot ${{ steps.collect.outputs.date }} (${{ steps.collect.outputs.count }} servers, ${{ steps.collect.outputs.drift }})"
            git push
          fi
